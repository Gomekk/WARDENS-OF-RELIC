.wdfoc .fcard .sl i.on{background:linear-gradient(160deg,color-mix(in srgb,var(--sc) 45%,#1A0E2E),#160B2C);border:1px solid var(--sc)}

.wdcap2{flex:1;min-width:0;border-radius:14px;padding:9px 11px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 30%,#160B2C),rgba(14,6,30,.97));border:1px solid color-mix(in srgb,var(--ac) 70%,transparent);box-shadow:0 0 24px -6px var(--ac),0 14px 30px rgba(0,0,0,.5)}

/* ===== v8：絵は元の色。サブ属性を派手にまとう ===== */
.wdtw.o>img,.wdtw.x>img,.wdtw.o>svg,.wdtw.x>svg{filter:none}
.wdtw.x{--pw:.85}.wdtw.x.n2{--pw:1}
.wdtw.x>i{position:absolute;inset:0;pointer-events:none;display:block}
/* 体にまとわりつく渦（回転する光） */
.wdtw.x>.sw{inset:-35%;background:conic-gradient(from 0deg,transparent 0 12%,var(--s1) 18%,transparent 26% 46%,var(--s2) 54%,transparent 62% 78%,var(--s1) 86%,transparent 94%);-webkit-mask:radial-gradient(closest-side,transparent 52%,#000 64%,transparent 76%);mask:radial-gradient(closest-side,transparent 52%,#000 64%,transparent 76%);mix-blend-mode:screen;opacity:calc(.75 * var(--pw));animation:wdrot 6s linear infinite}
/* 足元と左右から立ちのぼるオーラ */
.wdtw.x>.au{background:radial-gradient(90% 50% at 50% 110%,var(--s1),transparent 70%),radial-gradient(48% 60% at -6% 55%,var(--s1),transparent 70%),radial-gradient(48% 60% at 106% 50%,var(--s2),transparent 70%),radial-gradient(60% 30% at 50% -6%,var(--s2),transparent 70%);mix-blend-mode:screen;opacity:var(--pw);animation:wdaura2 2.4s ease-in-out infinite alternate}
@keyframes wdaura2{from{opacity:calc(.65 * var(--pw))}to{opacity:var(--pw)}}
/* 舞い上がる光の粒 */
.wdtw.x>.sp{background:radial-gradient(2.2px 2.2px at 14% 80%,#fff,transparent 70%),radial-gradient(3px 3px at 28% 92%,var(--s1),transparent 70%),radial-gradient(2px 2px at 70% 86%,#fff,transparent 70%),radial-gradient(3px 3px at 86% 74%,var(--s2),transparent 70%),radial-gradient(2.6px 2.6px at 50% 96%,var(--s1),transparent 70%),radial-gradient(2.4px 2.4px at 8% 52%,var(--s2),transparent 70%),radial-gradient(2.4px 2.4px at 92% 46%,var(--s1),transparent 70%),radial-gradient(1.8px 1.8px at 40% 70%,#fff,transparent 70%);mix-blend-mode:screen;animation:wdspark2 2.8s linear infinite}
@keyframes wdspark2{0%{transform:translateY(10%);opacity:0}20%{opacity:1}100%{transform:translateY(-30%);opacity:0}}
/* 縁の光彩 */
.wdtw.x>.rm{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--s1) 85%,#fff),inset 0 0 16px 2px var(--s1),inset 0 -18px 24px -8px var(--s2);opacity:var(--pw)}

/* 目が光る */

.wdtw.x>.ey::after{content:"";position:absolute;left:50%;top:50%;width:220%;height:8%;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(90deg,transparent,var(--s1),#fff,var(--s1),transparent);opacity:.55}
@keyframes wdeye{50%{transform:translate(-50%,-50%) scale(1.25);filter:brightness(1.3)}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
"use strict";
/* ============================================================
   ★ 新しいSupabaseの接続先（Project Settings → API）をここに入れる
   空のままでも、アプリの最初の画面から入力できます（その端末にだけ保存）
   ============================================================ */
const CFG_URL = "https://mspzgfkommmuucjvdvbm.supabase.co";
const CFG_KEY = "sb_publishable_sj2rETV0MdsP1hA56C70kQ_F5eS1Via";
const APP_VER = "v28";

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const SUPABASE_URL = (CFG_URL || lsGet("gl:sbUrl") || "").trim().replace(/\/+$/, "");
const SUPABASE_KEY = (CFG_KEY || lsGet("gl:sbKey") || "").trim();
const sb = SUPABASE_URL && SUPABASE_KEY && window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } }) : null;

const COLORS = ["#FFC93C", "#FF2E6A", "#19C9E6", "#8B5CFF", "#3FD67A", "#FF8A3D", "#FF6FB5", "#5A6378"];
const GAME_TBL = ["wd_games"];
const TABLES = ["players", "app_settings", ...GAME_TBL];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const db = { players: [], app_settings: [], hx_games: [], sz_games: [], lm_games: [], wd_games: [] };
let tab = lsGet("gl:tab") === "rec" ? "rec" : "done", loaded = false;
let me = lsGet("gl:me") || "";

/* ---------- プレイヤー・コンピューター ---------- */
const CPU_IDS = ["cpu1", "cpu2", "cpu3", "cpu4", "cpu5", "cpu6"];
const CPU_COLORS = ["#6B7A8F", "#9A6B4F", "#4F8A6B", "#7A5C99", "#B0703A", "#3F6E9A"];
const isCpu = id => typeof id === "string" && /^cpu\d$/.test(id);
const cpuPlayer = id => isCpu(id) ? { id, name: `🤖CPU${id.slice(3)}`, color: CPU_COLORS[(+id.slice(3) - 1) % CPU_COLORS.length], cpu: true } : undefined;
const player = id => db.players.find(p => p.id === id) || (db.wdPlayers || []).find(p => p.id === id) || cpuPlayer(id);
const pname = id => (player(id) || {}).name || "（不明）";
const pcolor = id => (player(id) || {}).color || "#5A6378";
const setting = k => (db.app_settings.find(s => s.key === k) || {}).value;
/* 旧アプリの「旅」の仕組みはこのアプリにはない */
const curTrip = () => null;
const activeMembers = () => [];

function toast(msg, ms = 2200){
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), ms);
}
const fail = (e, what) => { console.error(e); toast(`${what}できませんでした：${(e && e.message) || e}`, 4000); };
const dmNetErr = e => /TypeError|Load failed|Failed to fetch|NetworkError|network|fetch|timeout|ECONN/i.test(String((e && (e.message || e.name)) || e));
/* プッシュ通知は今のところ使わない（ゲーム側の呼び出しはそのまま残す） */
function pushCall(){}

/* ---------- データ ---------- */
async function loadTable(t){
  if (!sb) return;
  const cl = t === "wd_games" && typeof sbWd !== "undefined" && sbWd ? sbWd : sb;
  const { data, error } = await cl.from(t).select("*");
  if (error && GAME_TBL.includes(t)){ console.warn(t, error); db[t] = db[t] || []; return; }
  if (error) throw error;
  db[t] = data || [];
  if (t === "players") db.players.sort((a, b) => (a.sort ?? 0) - (b.sort ?? 0) || String(a.created_at).localeCompare(String(b.created_at)));
}
async function loadAll(){
  const extra = typeof sbWd !== "undefined" && sbWd && sbWd !== sb ? sbWd.from("players").select("*").then(r => { db.wdPlayers = r.data || []; }, () => {}) : null;
  await Promise.all([...TABLES.map(loadTable), extra]); loaded = true;
}
const reloadTimer = {};
const GAME_HOOK = { hx_games: () => [hxId, drawHx], sz_games: () => [szId, drawSz], lm_games: () => [lmId, drawLm], wd_games: () => [wdId, drawWd] };
const inGame = () => !!(hxId || szId || lmId || wdId);
/* リアルタイムで届いた変更を反映 */
function rtChange(payload){
  const t = payload.table;
  if (!TABLES.includes(t)) return;
  if (GAME_HOOK[t] && payload.eventType === "UPDATE" && payload.new && payload.new.id && payload.new.st){
    const nw = payload.new, cur = (db[t] || []).find(x => x.id === nw.id);
    if (cur && (cur.version || 1) >= (nw.version || 1)) return;      // 自分の保存のこだま
    if (cur){ Object.assign(cur, nw); const [id, draw] = GAME_HOOK[t](); if (id === nw.id) draw(); else if (!inGame()) render(); turnBuzz(); setTimeout(cpuKick, 0); return; }
  }
  clearTimeout(reloadTimer[t]);
  reloadTimer[t] = setTimeout(async () => {
    try { await loadTable(t); if (!inGame()) render(); if (GAME_HOOK[t]) GAME_HOOK[t]()[1](); turnBuzz(); cpuKick(); } catch (e) { console.error(e); }
  }, 120);
}
function subscribe(){
  if (!sb) return;
  sb.channel("gamelab-all").on("postgres_changes", { event: "*", schema: "public" }, rtChange).subscribe();
  // WARDENS OF RELIC を別のSupabaseで動かしているとき（ボドゲOnline）
  if (typeof sbWd !== "undefined" && sbWd && sbWd !== sb) sbWd.channel("gamelab-wd").on("postgres_changes", { event: "*", schema: "public", table: "wd_games" }, rtChange).subscribe();
}

async function q(promise, what){
  const { data, error } = await promise;
  if (error){ fail(error, what); return null; }
  return data ?? true;
}
async function putSetting(key, value){ return q(sb.from("app_settings").upsert({ key, value, updated_at: new Date().toISOString() }), "保存"); }

/* ---------- 楽観的な更新：タップしたらすぐ画面を進め、保存に失敗したら元に戻す ---------- */
function optimistic(g, body, draw){
  const old = { st: g.st, version: g.version, log: g.log, status: g.status, winner: g.winner };
  Object.assign(g, body);
  try { draw(); } catch (e) { console.error(e); }
  return () => { Object.assign(g, old); };
}
/* ---------- シート ---------- */
function openSheet(title, html){
  const tk = String(title), was = $("#sheet").classList.contains("on");
  $("#sheetIn").innerHTML = `<h3><span class="ht">${title}</span><button class="x" data-close>閉じる</button></h3>${html}`;
  if (!was || openSheet.t !== tk){ $("#sheetIn").scrollTop = 0; }
  openSheet.t = tk;
  $("#sheet").classList.add("on");
  $("#sheetIn").querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet);
  return $("#sheetIn");
}

/* 席順・手番順のドラッグ並べ替え */
function seatDrag(box, getOrder, setOrder, redraw){

      e.preventDefault();

      const hit = ev => { el.style.pointerEvents = "none"; const u = document.elementFromPoint(ev.clientX, ev.clientY); el.style.pointerEvents = ""; return u && u.closest && u.closest("[data-seat]"); };

      const up = ev => {
        el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);

/* ---------- コンピューター（CPU）の手番 ----------
   参加している人間の端末がCPUの一手を打つ。版番号チェックで1回分しか通らない */
const CPU_AI = {};
let cpuTimers = {};
const cpuSkipping = false;
function cpuKick(){
  if (!loaded || !me || isCpu(me)) return;
  Object.keys(CPU_AI).forEach(tb => {
    (db[tb] || []).forEach(g => {
      if (g.status !== "playing" || !(g.players || []).includes(me) || !(g.players || []).some(isCpu)) return;
      const key = tb + ":" + g.id, ver = g.version || 0;
      const cur = cpuTimers[key];
      if (cur && cur.ver === ver) return;
      if (cur) clearTimeout(cur.tm);
      let mv = null;
      try { mv = CPU_AI[tb](g); } catch (e) { console.error(e); }
      if (!mv){ delete cpuTimers[key]; return; }
      const humans = g.players.filter(x => !isCpu(x)), my = Math.max(0, humans.indexOf(me));
      const wait = (mv.wait || 1200) + my * 900 + Math.random() * 300;
      const tries0 = cur && cur.ver === -1 ? cur.tries || 0 : 0;
      cpuTimers[key] = { ver, tries: tries0, tm: setTimeout(async () => {
        const g2 = (db[tb] || []).find(x => x.id === g.id);
        if (!g2 || (g2.version || 0) !== ver || g2.status !== "playing"){ delete cpuTimers[key]; cpuKick(); return; }
        let ok = true;
        try { ok = await mv.run(); } catch (e) { console.error(e); ok = false; }
        const tries = ((cpuTimers[key] || {}).tries || 0) + 1;
        cpuTimers[key] = { ver, done: true, tries };
        const g3 = (db[tb] || []).find(x => x.id === g.id);
        if (ok === false && tries < 6 && g3 && (g3.version || 0) === ver) setTimeout(() => { const c2 = cpuTimers[key]; if (c2 && c2.ver === ver && c2.done){ cpuTimers[key] = { ver: -1, tries }; cpuKick(); } }, 2500 * tries);
        setTimeout(cpuKick, 50);
      }, wait) };
    });
  });
}

function wdTrePlan(st, p, id){

}

/* ---------- サーバー（Edge Function：wd-move）に手を送る ----------
   ルールの判定・ダイス・コンピューターの手番はすべてサーバーが行う（Web版とUnity版で共通） */
/* WARDENS OF RELIC のサーバー（専用アプリは自分のSupabase、ボドゲOnlineは専用アプリのSupabaseを使う：同じ対戦に参加できる） */
const WD_BASE = typeof WD_REMOTE !== "undefined" && WD_REMOTE ? WD_REMOTE : { url: SUPABASE_URL, key: SUPABASE_KEY };
const sbWd = WD_BASE.url === SUPABASE_URL ? sb : (window.supabase ? supabase.createClient(WD_BASE.url, WD_BASE.key, { auth: { persistSession: false } }) : null);
const WD_FN = () => WD_BASE.url + "/functions/v1/wd-move";
async function wdCall(body){
  for (let tries = 0; tries < 3; tries++){
    try {
      const res = await fetch(WD_FN(), { method: "POST", headers: { "Content-Type": "application/json", apikey: WD_BASE.key }, body: JSON.stringify(body) });
      const txt = await res.text(); let j = null; try { j = JSON.parse(txt); } catch (e) {}
      if (j) return j;
      if (res.status === 404) return { ok: false, error: "サーバー（wd-move）が見つかりません。Edge Function をデプロイしてください" };
      return { ok: false, error: `${res.status} ${txt.slice(0, 120)}` };
    } catch (e) {
      if (tries < 2 && dmNetErr(e)){ await new Promise(r => setTimeout(r, 700 * (tries + 1))); continue; }
      return { ok: false, error: String((e && e.message) || e) };
    }
  }
}
/* サーバーから届いた最新の対戦を手元に反映 */
function wdGot(row){
  if (!row || !row.id) return;
  const list = db.wd_games = db.wd_games || [];
  const g = list.find(x => x.id === row.id);
  if (!g) list.push(row);
  else if ((row.version || 1) >= (g.version || 1)) Object.assign(g, row);
}
const wdBusy = {};
/* 1手を送る。乱数は対戦ごとの種で決まるので、端末で先に計算して（コンピューターの番も含めて）すぐ表示する。
   サーバーも同じ計算をするので結果は一致する。送信は裏で順番に行い、操作は待たせない */
const wdSendQ = {};
function wdSend(id, p, mv){
  const run = async () => { const r = await wdCall({ op: "move", id, p, mv }); if (r && r.ok){ wdGot(r.row); drawWd(); turnBuzz(); return; } throw r || {}; };
  wdSendQ[id] = (wdSendQ[id] || Promise.resolve()).then(run).catch(async r => {
    wdSendQ[id] = Promise.resolve();
    try { await loadTable("wd_games"); } catch (e) {}
    drawWd(); toast((r && r.error) || "送れませんでした。最新の状態に戻しました", 2800);
  });
}
async function wdDo(id, p, mv){
  const g = wdById(id); if (!g || g.status !== "playing" || !g.st) return false;
  if (wdBusy[id]) return false;
  const st = JSON.parse(JSON.stringify(g.st)); st._log = [];
  const seeded = st.rs != null;
  let rnd = 0; const R = Math.random; if (!seeded) Math.random = () => { rnd++; return R(); };
  let ok = false; try { ok = wdApply(st, p, mv); if (ok && seeded) wdRunCpu(st); } catch (e) { console.error(e); ok = false; } finally { Math.random = R; }
  if (!ok) return false;
  const lines = st._log; delete st._log;
  if (seeded || !rnd){
    const body = { st, version: (g.version || 1) + 1 };
    if (st.status !== "playing"){ body.status = "finished"; body.winner = (st.wins || [])[0] || null; }
    if (lines.length){ const lg = (g.log || []).slice(), now = Date.now(); lines.forEach((m, i) => lg.push({ t: new Date(now + i).toISOString(), m })); body.log = lg.slice(-150); }
    optimistic(g, body, drawWd);
    wdSend(id, p, mv);
    return true;
  }
  // 古い対戦（乱数の種がない）でダイスが絡むときだけは、サーバーの結果を待つ
  wdBusy[id] = 1;
  const slow = setTimeout(() => toast("通信中…", 1500), 1200);
  let r;
  try { await (wdSendQ[id] || Promise.resolve()); r = await wdCall({ op: "move", id, p, mv }); } finally { clearTimeout(slow); delete wdBusy[id]; }
  if (r && r.ok){ wdGot(r.row); drawWd(); turnBuzz(); return true; }
  if (r && r.row) wdGot(r.row); else { try { await loadTable("wd_games"); } catch (e) {} }
  drawWd(); toast((r && r.error) || "送れませんでした", 2600);
  return false;
}
/* コンピューターの手番はサーバーが進める。止まって見えるときだけ、念のため声をかける */
CPU_AI.wd_games = g => {
  const st = g.st; if (!st || !st.wd || g.status !== "playing") return null;
  if (!wdActors(st).some(isCpu)) return null;
  return { wait: 2500, run: async () => {
    if (wdPlay) return true;
    const r = await wdCall({ op: "cpu", id: g.id });
    if (r && r.ok){ wdGot(r.row); drawWd(); return true; }
    return false;
  } };
};

/* 獲得した秘宝の★の合計：目標の数だけ並べて、取った分を塗る（例：3つなら ★★★☆☆☆☆☆） */
const wdStarMeter = n => { const goal = WD_WIN_STARS || 8, k = Math.min(n, goal); return `<span class="stm" aria-label="★${n}/${goal}"><b>${"★".repeat(k)}</b>${"☆".repeat(goal - k)}${n > goal ? `<b>${"★".repeat(n - goal)}</b>` : ""}</span>`; };
/* ---------- 手元のキャラの色：付いている属性に染まる（無属性なら色なし）。山札・図鑑・ルールでは得意属性の色のまま ---------- */
function wdTintBg(c){
  const m = c.s[0], subs = c.s.slice(1).filter(Boolean);
  if (!m && !subs.length) return "";
  const parts = [];
  if (m) parts.push([WD_COL[m], subs.length ? 60 : 100]);
  subs.forEach(a => parts.push([WD_COL[a], (m ? 40 : 100) / subs.length]));
  let at = 0; const stops = [];
  parts.forEach(([col, w], i) => { const a0 = at, a1 = at + w; stops.push(`${col} ${(a0 + (i ? 3 : 0)).toFixed(1)}%`, `${col} ${(a1 - (i < parts.length - 1 ? 3 : 0)).toFixed(1)}%`); at = a1; });
  return `linear-gradient(165deg,${stops.join(",")})`;
}
const wdCAc = c => WD_COL[c.s[0] || c.s.find(Boolean) || "無"];
/* 手元のキャラ：絵は元の色のまま。サブ属性が付くと、キャラ本体が変わる
   サブ1つ目 → 目がその色に光り、体がその色を帯びる ／ サブ2つ目 → 体にその色のエネルギーが巻きつく */
/* 属性ごとのエフェクト（キャラの体のまわり）。cx,cy：体の中心、rx,ry：体の大きさ（SVG座標 100×125） */
function wdElFx(a, col, cx, cy, rx, ry, k){
  const R = (i, n, f = 1) => { const t = (i / n) * Math.PI * 2 + k; return [cx + Math.cos(t) * rx * f, cy + Math.sin(t) * ry * f]; };
  const d = i => `style="animation-delay:-${(i * 0.37).toFixed(2)}s"`;
  let h = "";
  if (a === "雷"){
    for (let i = 0; i < 4; i++){ const [x, y] = R(i, 4, .95), s = i % 2 ? -1 : 1;
      const pts = `${x},${y - 14} ${x + 5 * s},${y - 5} ${x - 3 * s},${y - 2} ${x + 4 * s},${y + 8} ${x - 2 * s},${y + 5} ${x + 2 * s},${y + 15}`;
      h += `<g class="bolt" ${d(i)}><polyline points="${pts}" stroke="${col}" stroke-width="3.2" opacity=".6"/><polyline points="${pts}" stroke="#fff" stroke-width="1.1"/></g>`; }
    h += `<ellipse class="zap" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" stroke="${col}" stroke-width="1.2" stroke-dasharray="3 7 1 9"/>`;
  } else if (a === "炎"){
    for (let i = 0; i < 7; i++){ const x = cx - rx * .9 + (rx * 1.8) * (i / 6), y = cy + ry * (.55 + (i % 3) * .12);
      h += `<path class="flame" ${d(i)} d="M${x} ${y} c-4 -6 -2 -11 0 -17 c2 6 6 9 4 14 c-1 2 -3 3 -4 3z" fill="${col}"/><circle class="ember" ${d(i + 3)} cx="${x + 2}" cy="${y - 6}" r="1.1" fill="#FFE2A0"/>`; }
  } else if (a === "水"){
    for (let i = 0; i < 7; i++){ const x = cx - rx * .8 + (rx * 1.6) * ((i * 37 % 7) / 6), y = cy + ry * .7;
      h += `<circle class="bub" ${d(i)} cx="${x}" cy="${y}" r="${1.4 + (i % 3) * .8}" stroke="#E8FBFF" stroke-width=".7" fill="${col}" fill-opacity=".35"/>`; }
    h += `<ellipse class="rip" cx="${cx}" cy="${cy + ry * .95}" rx="${rx * .6}" ry="${ry * .12}" stroke="${col}" stroke-width="1.4"/><ellipse class="rip" style="animation-delay:-1.1s" cx="${cx}" cy="${cy + ry * .95}" rx="${rx * .6}" ry="${ry * .12}" stroke="#E8FBFF" stroke-width=".8"/>`;
  } else if (a === "木"){
    for (let i = 0; i < 7; i++){ const [x, y] = R(i, 7, 1.02);
      h += `<g class="leaf" ${d(i)} style="transform-origin:${cx}px ${cy}px;animation-delay:-${(i * .9).toFixed(1)}s"><path d="M${x} ${y} q3 -4 7 -1 q-3 4 -7 1z" fill="${col}" stroke="#D8FFB0" stroke-width=".4"/></g>`; }
  } else if (a === "闇"){
    for (let i = 0; i < 4; i++){ const [x, y] = R(i, 4, .75);
      h += `<ellipse class="smoke" ${d(i)} cx="${x}" cy="${y}" rx="${rx * .55}" ry="${ry * .3}" fill="${col}" filter="url(#wdblur)"/>`; }
    h += `<ellipse class="smoke2" cx="${cx}" cy="${cy + ry * .6}" rx="${rx * .9}" ry="${ry * .35}" fill="#140024" filter="url(#wdblur)"/>`;
  } else if (a === "龍"){
    h += `<g class="orbit" style="transform-origin:${cx}px ${cy}px">${Array.from({ length: 8 }, (_, i) => { const [x, y] = R(i, 8, 1.05); return `<circle cx="${x}" cy="${y}" r="${i % 2 ? 1.3 : 2.1}" fill="${i % 2 ? "#FFE7A3" : col}"/>`; }).join("")}</g>`;
    h += `<ellipse class="scale" cx="${cx}" cy="${cy}" rx="${rx * .8}" ry="${ry * .8}" stroke="${col}" stroke-width="2.4" stroke-dasharray="2 4"/>`;
  } else if (a === "覇"){
    h += `<g class="rays" style="transform-origin:${cx}px ${cy}px">${Array.from({ length: 10 }, (_, i) => { const [x1, y1] = R(i, 10, .55), [x2, y2] = R(i, 10, 1.25); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${i % 2 ? 1.2 : 2.2}"/>`; }).join("")}</g>`;
    h += `<path class="crown" d="M${cx - 8} ${cy - ry - 2} l3 -7 l3 4 l2 -6 l2 6 l3 -4 l3 7z" fill="${col}" stroke="#FFE7A3" stroke-width=".6"/>`;
  } else if (a === "天"){
    h += `<ellipse class="halo" cx="${cx}" cy="${cy - ry * .95}" rx="${rx * .45}" ry="${ry * .1}" stroke="#FFF8DC" stroke-width="2"/>`;
    for (let i = 0; i < 3; i++) h += `<polygon class="beam" ${d(i)} points="${cx - 6 + i * 6},0 ${cx - 2 + i * 6},0 ${cx - 10 + i * 10},125 ${cx - 18 + i * 10},125" fill="${col}"/>`;
    for (let i = 0; i < 6; i++){ const [x, y] = R(i, 6, 1.05); h += `<path class="twk" ${d(i)} d="M${x} ${y - 3} L${x + .8} ${y} L${x} ${y + 3} L${x - .8} ${y}Z M${x - 3} ${y} L${x} ${y + .8} L${x + 3} ${y} L${x} ${y - .8}Z" fill="#fff"/>`; }
  } else if (a === "幻"){
    h += `<g class="orbit2" style="transform-origin:${cx}px ${cy}px">${Array.from({ length: 6 }, (_, i) => { const [x, y] = R(i, 6, 1.0); return `<path d="M${x} ${y - 4} L${x + 2.4} ${y} L${x} ${y + 4} L${x - 2.4} ${y}Z" fill="hsl(${i * 60},90%,75%)" stroke="#fff" stroke-width=".4"/>`; }).join("")}</g>`;
    h += `<ellipse class="prism" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" stroke="${col}" stroke-width="1.6" stroke-dasharray="6 4"/>`;
  }
  return `<svg class="efx e-${WD_ELF[a]}" viewBox="0 0 100 125" preserveAspectRatio="none" aria-hidden="true"><defs><filter id="wdblur"><feGaussianBlur stdDeviation="2.4"/></filter></defs><g fill="none" stroke-linecap="round" stroke-linejoin="round">${h}</g></svg>`;
}
const wdArtC = (c, cls = "") => {
  const subs = c.s.slice(1).filter(Boolean), F = WD_ARTF[c.k];
  if (!subs.length || !F) return `<span class="wdtw o ${cls}">${wdCharArt(c.k)}</span>`;
  const a1 = WD_COL[subs[0]], a2 = WD_COL[subs[1] || subs[0]], [bx, by, rx, ry] = F.b;
  const body = `--bx:${bx}%;--by:${by}%;--rx:${rx}%;--ry:${ry}%`;
  const eyes = F.e.map(([x, y]) => `<i class="ey" style="left:${x}%;top:${y}%"></i>`).join("");
  const fx = [...new Set(subs)].map((a, i) => wdElFx(a, WD_COL[a], bx, by * 1.25, rx * .95, ry * 1.25 * .95, i * 1.7)).join("");
  return `<span class="wdtw x n${subs.length} ${cls}" style="--s1:${a1};--s2:${a2};${body}">${wdCharArt(c.k)}<i class="bd"></i>${subs[1] ? `<i class="wr"></i>` : ""}${eyes}${fx}</span>`;
};
const wdEmbC = c => `<span class="wdemb wdembc" style="--ac:${wdCAc(c)}">${wdArtC(c)}</span>`;

/* ---------- 属性テーマ：出た目の属性に背景が染まる（次の目が決まるまで） ---------- */
let wdThCur = "";
function wdSetTheme(a, b){
  const key = (a || "") + (b ? "|" + b : "");
  if (key === wdThCur) return; wdThCur = key;
  const root = document.getElementById("wdg"), bg = root && root.querySelector(".wdbg"); if (!bg) return;
  root.style.setProperty("--th", a ? WD_COL[a] : "#E07CFF"); root.style.setProperty("--th2", b ? WD_COL[b] : a ? WD_COL[a] : "#E07CFF");
  const el = document.createElement("div"); el.className = "wdth" + (b ? " dual" : "");
  el.innerHTML = !a ? "" : b ? `<i class="h h1" data-el="${a}"></i><i class="h h2" data-el="${b}"></i><i class="seam" style="--a:${WD_COL[a]};--b:${WD_COL[b]}"></i>` : `<i class="h" data-el="${a}"></i>`;
  bg.appendChild(el); void el.offsetWidth; el.classList.add("on");
  const old = [...bg.querySelectorAll(".wdth")].filter(x => x !== el);
  setTimeout(() => old.forEach(x => x.remove()), 1200);
}
function wdThemeOf(st, upto = Infinity){
  const fx = (st.fx || []).filter(e => e.n <= upto);
  let f = null; for (let i = fx.length - 1; i >= 0; i--) if (fx[i].k === "face"){ f = fx[i]; break; }
  if (!f) return { a: upto === Infinity && st.T && st.T.face ? st.T.face : null };
  let b = null;
  if (fx.some(e => e.n > f.n && e.k === "buff" && e.t === "もう1つの目でも行動")){
    let r = null; for (let i = fx.length - 1; i >= 0; i--) if (fx[i].k === "roll" && fx[i].n < f.n){ r = fx[i]; break; }
    b = r ? r.dice.find(x => x !== f.a) || null : null;
  }
  return { a: f.a, b };
}

/* ---------- 確認ダイアログ ---------- */
function wdConfirm(title, body, ok, danger){
  return new Promise(res => {
    let done = false; const fin = v => { if (done) return; done = true; el.remove(); res(v); };
    const el = wdPopup(`<div class="wdcf"><b>${title}</b><p>${body}</p><div class="wdas-row"><button class="wdbtn ghost" data-no>やめる</button><button class="wdbtn ${danger ? "danger strong" : "main"}" data-ok>${ok}</button></div></div>`, "cf", true);
    el.querySelector("[data-no]").onclick = () => fin(false);
    el.querySelector("[data-ok]").onclick = () => fin(true);
    el.addEventListener("click", e => { if (e.target === el || e.target.closest("[data-wdx]")) fin(false); });
  });
}

/* ---------- キャラの効果一覧（ポップアップ） ---------- */
function wdCharPop(k, c, st, owner){
  const d = WD_CH[k];
  const rows = ["無", ...WD_AT].map(a => {
    const cost = a === "無" ? "−" : c && st && owner ? `${wdGrantCost(st, owner, c, a)}` : `${wdGrantBase({ k }, a)}`;
    return `<div class="wdeff ${a === d.sig ? "sig" : ""} ${c && c.s.includes(a) ? "have" : ""}" style="--ac:${WD_COL[a]}"><span class="wdea">${a === "無" ? "<b>無</b>" : wdIco(a)}<em>${a}</em></span><p>${esc(d.e[a].tx)}</p><span class="wdec">${a === "無" ? "" : `${cost}<small>wp</small>`}</span></div>`;
  }).join("");
  const lv = WD_LVT[d.t].map((v, i) => `<span class="${c && c.lv === i + 1 ? "on" : ""}"><small>Lv${i + 1}</small>${v}</span>`).join("");
  return wdPopup(`<div class="wdcp-hd" style="--ac:${c && owner ? wdCAc(c) : WD_COL[d.sig]}">${c && owner ? wdEmbC(c) : wdEmb(k)}<div><small>${d.th}・${esc(d.im)}</small><b>${d.n}</b><span>${wdTypeB(d)}得意 ${d.sig}・干渉 ${d.it}・獲得 ${d.cost}wp</span></div></div>
    <p class="wdcp-desc">${esc(d.desc)}</p>

function wdPopup(html, cls = "", over = false){
  // over：開いているポップアップの上に重ねる（閉じると下の画面に戻る）
  const id = over ? "wdPop2" : "wdPop";

  return el;
}

/* ---------- ガイド ---------- */
function wdGuide(st, g){
  if (g.status === "finished") return "ゲーム終了！";
  if (st.ph === "draft"){
    const D = st.dr; if (!st.order.includes(me)) return "キャラを選んでいます…";
    if (D.pick[me] != null) return "ほかの人がキャラを選ぶのを待っています";
    return D.step === 1 ? "【ドラフト1/2】配られた3体から、使いたいキャラを1体選びます。残りの2体は次の人へ回ります。" : "【ドラフト2/2】回ってきた2体から1体選びます。残りは山札に戻ります。";
  }
  const T = st.T; if (!T) return "";
  const mine = T.p === me;
  if (st.ask) return st.ask.pid === me ? `【効果の選択】${st.ask.q}を選んでください。` : `${wdNm(st.ask.pid)}が「${st.ask.q}」を選んでいます…`;
  if (T.ph === "pick") return T.pickBy === me ? `【手順1】出た目から1つ選びます。その属性のキューブを持つ人は全員wpをもらえます（メイン枠は2倍）。自分のキャラが動けるのもその属性です。${T.pickBy !== T.p ? "（ナイトメアの効果で、あなたが目を選びます）" : ""}` : `${wdNm(T.pickBy)}が目を選んでいます…`;
  if (!mine) return `${wdNm(T.p)}の手番です。手順1で選ばれた目のキューブを持っていれば、あなたもwpをもらえます。`;
  if (T.ph === "roll") return "【手順1】ダイスを振ります。2つの目から1つを選びます。";
  if (T.ph === "act"){
    const left = st.ch[me].filter(c => wdCanAct(st, c.id)).length;
    return left ? `【手順3】光っているキャラ（${left}体）をタップして、属性付与・Lv上げ・キャラ獲得・wp獲得から1つ選びます。長押しで効果を確認できます。` : "【手順3】行動は終わりです。「手順4へ」で秘宝に挑戦します。";
  }
  if (T.ph === "tre") return "【手順4】光っている秘宝をタップして獲得（何個でも）。枠が足りなければ自分のキャラをタップして手放します。終わったら「ターン終了」。";
  return "";
}

function wdPodH(D, p, side){

/* 相手と早見表の配置：上の段に相手、2段目は 左の相手｜早見表｜右の相手 */
function wdOppsH(D, opp){
  const n = opp.length, at = [];
  if (n === 1) at.push([opp[0], "a", "top"]);
  else if (n === 2) at.push([opp[0], "a", "side"], [opp[1], "b", "side"]);
  else if (n === 3) at.push([opp[0], "a", "side"], [opp[1], "t", "top"], [opp[2], "b", "side"]);
  else at.push([opp[0], "a", "side"], [opp[1], "t", "side"], [opp[2], "u", "side"], [opp[3], "b", "side"]);

function wdEarnTbl(c){
  const m = c.s[0], w = wdLvWp(c), pr = fs => `${fs.reduce((n, f) => n + WD_DIE.filter(z => z === f).length, 0)}/20`;
  const ics = fs => fs.map(f => `<span class="ic">${wdIco(f)}<small>${f}</small></span>`).join("");

  if (!m) return `<div class="wdearn">${head}<div class="r neu"><span class="k">どの目でも</span><span class="v">${ics(WD_AT)}</span><em>×1</em><b class="w">= ${w}wp</b></div><p class="note">メイン枠に属性を付けると、有利・不利が生まれます。</p></div>`;
  const adv = WD_AT.filter(f => wdMult(m, f) === 2), dis = WD_AT.filter(f => wdMult(m, f) === .5), neu = WD_AT.filter(f => wdMult(m, f) === 1);
  const row = (cls, k, fs, x, v) => fs.length ? `<div class="r ${cls}"><span class="k">${k}<small>${pr(fs)}</small></span><span class="v">${ics(fs)}</span><em>${x}</em><b class="w">= ${v}wp</b></div>` : "";
  return `<div class="wdearn">${head}${row("adv", "有利", adv, "×2", w * 2)}${row("dis", "不利", dis, "×½", Math.round(w / 2))}${row("neu", "中立", neu, "×1", w)}</div>`;
}

/* 属性の相性の早見図（矢印の先に強い） */
function wdChart(big){
  const P = { 水: [30, 16], 炎: [50, 50], 木: [10, 50], 雷: [88, 16], 闇: [88, 50], 龍: [128, 16], 覇: [168, 16], 天: [168, 50], 幻: [128, 50] };
  const R = 10, id = big ? "wdarB" : "wdarS";
  const ar = (a, b, two) => { const [x1, y1] = P[a], [x2, y2] = P[b], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    return `<line x1="${(x1 + ux * (R + 1.5)).toFixed(1)}" y1="${(y1 + uy * (R + 1.5)).toFixed(1)}" x2="${(x2 - ux * (R + 3)).toFixed(1)}" y2="${(y2 - uy * (R + 3)).toFixed(1)}" stroke="#FFE7A3" stroke-width="1.6" marker-end="url(#${id})"${two ? ` marker-start="url(#${id})"` : ""}/>`; };
  const dot = a => { const [x, y] = P[a]; return `<circle cx="${x}" cy="${y}" r="${R}" fill="${WD_COL[a]}" stroke="#fff" stroke-opacity=".6" stroke-width="1"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="900" fill="${["天", "雷"].includes(a) ? "#2A1C06" : "#fff"}" ${["天", "雷"].includes(a) ? "" : 'stroke="#000" stroke-opacity=".35" stroke-width=".6"'}>${a}</text>`; };
  return `<svg class="wdchart ${big ? "big" : ""}" viewBox="-2 2 182 ${big ? 76 : 64}" aria-hidden="true"><defs><marker id="${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#FFE7A3"/></marker></defs>
    ${ar("水", "炎")}${ar("炎", "木")}${ar("木", "水")}${ar("雷", "闇", true)}${ar("龍", "覇")}${ar("覇", "天")}${ar("天", "幻")}${ar("幻", "龍")}
    ${Object.keys(P).map(dot).join("")}${big ? `<text x="90" y="74" text-anchor="middle" font-size="8" fill="#A99CC9">矢印の先の属性に強い（wp獲得で×2、逆向きは×½）</text>` : ""}</svg>`;
}

function wdRulesHtml(){
  return `<h4>目的</h4><p>守護者の力 <b>wp</b>（Wardens Point）を集め、属性キューブと合わせて<b>秘宝の★の合計が最初に${WD_WIN_STARS}以上になった人の勝ち</b>（★1〜★5、各2つ）。届く前に秘宝が全部なくなったら、★の合計が多い人の勝ち（同じならwpが多い人）。枠は4つでキャラが最低1体いるので、秘宝は最大3つ。安い秘宝で枠を埋めると★が届かなくなるので注意。wpは全員に公開。</p>
  <h4>準備</h4><p>全員1000wp（2番手以降は${WD_SEAT_BONUS}wpずつ多い）。キャラを3体配り、1体取って残り2体を次の人へ。受け取った2体から1体取り、残りは山札へ（1人2体）。場にキャラを3体並べる。キャラはLv1から。<b>メイン枠（一番上）は、そのキャラの得意属性で最初から固定</b>（付け替え・取り外しはできない）。サブの2枠は「無」から始まる。</p>
  <h4>手番の流れ</h4>
  <p><b>手順1：ダイス</b> 属性ダイス（20面：炎・水・木 各4、雷・闇 各2、龍・幻・天・覇 各1）を2つ振り、1つの目を選ぶ。その属性のキューブを持つ人は全員（振った人も）キューブ1つにつき 炎水木100・雷闇200・龍幻天覇400wp。メイン枠（一番上）のキューブは2倍。自分のキャラにキューブが1つもなければ、手順1はとばす。</p>
  <p><b>手順2：キャラが行動</b> 「無」の枠があるキャラと、選んだ目の属性を持つキャラが動く。無の枠1つにつき無の効果を1回、選んだ目のキューブ1つにつきその属性の効果を1回。動いたキャラは1体につき1回、キャラLvに応じたwpをもらう。</p>
  <p><b>手順3：1つ選ぶ</b>（手順2で動いたキャラだけ）<br>・属性付与：空いているサブの枠に好きな属性を付ける（コストはキャラごと。得意属性は半額）<br>・Lv上げ：1→2 100、2→3 500、3→4 2000、4→5 5000wp<br>・キャラ獲得：場の3体から1体（次の手番から行動）<br>・wp獲得：ダイスを1つ振り、メイン属性に有利な目ならキャラLvのwpの2倍、不利なら半分</p>
  <p><b>手順4：秘宝</b> 何個でも。必要wpを払い、必要なキューブをキャラのサブの枠から外して秘宝にはめる（メイン属性は固定なので使えない）。外したサブの枠は無に戻り、また付け直せる。</p>
  <h4>枠</h4><p>1人4枠。キャラと秘宝が1つずつ使う。キャラを手放すときは、そのキャラの獲得コストと同じwpを払う（秘宝を取るために手放すときは無料）。手放したキャラは山札へ戻し、場も含めてシャッフルして3体めくり直す。メイン属性は得意属性で固定。サブの2枠が両方埋まると、無の効果はなくなる。</p>
  <h4>相性（wp獲得で使う）</h4><p>水→炎→木→水（矢印の先に強い）／雷と闇はお互いに有利／龍→覇→天→幻→龍</p>
  <h4>干渉</h4><p>他人の邪魔をする効果は龍・覇・幻だけ。天の「干渉無効」は、奪う・キューブを無に戻す・行動封じ・Lvを下げる、など全部を防ぐ（次の自分の手番まで）。行動封じされたキャラは次の手番の終わりまで行動できず、手順1のwpももらえない。</p>
  <h4>秘宝</h4><p>持っている間ずっと効く能力がある。必要な属性キューブの組み合わせは、ゲームごとにランダムに決まる（出やすさはダイスの目と同じ）。</p><p>${WD_TRE.map(t => `${wdStarTx(t.r)} <b>${t.n}</b>：${t.wp.toLocaleString()}wp＋属性キューブ${t.cb.length}つ<br><small>能力：${t.ab}</small>`).join("<br>")}</p>
  <h4>画面の操作</h4><p>・タップで操作、<b>長押しで詳しく</b>（キャラの効果一覧・秘宝の条件・ダイスの目で誰がいくらもらえるか・プレイヤーの持ち物）。<br>・効果の対象を選ぶときは、卓の光っているキャラやキューブを直接タップしても選べます。<br>・ほかの人の手番は、ダイス・効果・wpの移動などを順番に再生します。右上の「演出」で速さを変えられ、「スキップ」で飛ばせます。</p>
  <h4>キャラクター一覧（全${WD_CH.length}体）</h4><p class="wdrn">付与コストは「炎水木／雷闇／龍覇天幻」。★は得意属性（付与コスト半額）。</p>
  ${WD_CH.map((d, k) => `<details class="wdrc"><summary><b>${d.n}</b><small>${d.t}・得意${d.sig}・${d.it}・${d.cost}wp・${d.th}</small></summary><p>${esc(d.desc)}<br><small>Lvごとのwp：${WD_LVT[d.t].join(" / ")}　付与：${[0, 1, 2].map(i => WD_GC[d.t][i]).join(" / ")}（得意は半額）</small></p><table>${["無", ...WD_AT].map(a => `<tr${a === d.sig ? ' class="sig"' : ""}><th>${a}${a === d.sig ? "★" : ""}</th><td>${esc(d.e[a].tx)}</td></tr>`).join("")}</table></details>`).join("")}`;
}

function viewShelf(st){
  const S = stages(), list = GAMES.filter(gm => S[gm.id] === st);
  const dev = st === "dev";
  let h = `<div class="shelf-hd ${st}"><span class="big">THE GUARDIANS OF TREASURE</span><h2>WARDENS<br>OF RELIC</h2><p>秘宝をめぐる、神話の魔獣たちの争奪戦</p></div>`;
  // 自分が参加している対戦中のゲーム
  const mine = list.flatMap(gm => gm.live().filter(g => me && (g.players || []).includes(me)).map(g => ({ gm, g })));
  h += mine.map(({ gm, g }) => `<button class="livebar" data-gopen="${gm.id}" data-gid="${g.id}">${gm.icon()}<div><b><span class="livedot"></span>${gm.name} 対戦中</b><small>${gm.myTurn(g) ? `<em class="yt">あなたの番！</em>` : ""}${esc(gm.liveTx(g))}</small></div><span class="go">JOIN</span></button>`).join("");

  h += `<div class="posters">${list.map((gm, i) => {
    const lv = gm.live();
    return `<article class="poster t-${gm.id} ${st}" style="--i:${i}"><div class="pin">
      <div class="art">${ART[gm.id]}</div>
      ${dev ? `<div class="tape"><span>${"IN DEVELOPMENT ・ 開発中 ・ BETA TEST ・ ".repeat(6)}</span></div><span class="beta">β</span>` : ""}
      <div class="ptop">${gm.icon()}<div class="ttl"><span class="en">${gm.en}</span><h3>${gm.name}</h3><div class="meta"><span>${gm.players}</span><span>${gm.time}</span><span>${finishedPvp(gm).length}回プレイ</span></div></div></div>
      <p class="pdesc">${gm.desc}</p>
      ${lv.length ? `<div class="plives">${lv.map(g => { const mn = !!me && (g.players || []).includes(me); return `<div class="plv"><span class="who"><em>${mn ? "参加中" : "LIVE"}</em>${(g.players || []).map(p => `<i style="--pc:${pcolor(p)}">${esc(pname(p))}</i>`).join("")}</span>${mn ? `<button class="mini" data-gopen="${gm.id}" data-gid="${g.id}">参加</button>` : `<button class="mini watch" data-gopen="${gm.id}" data-gid="${g.id}">観戦</button>`}</div>`; }).join("")}</div>` : ""}
      <div class="pact"><button class="ghostb" data-grule="${gm.id}">ルール</button><button class="cta" data-start="${gm.id}">PLAY<small>${lv.length ? "新しく遊ぶ" : dev ? "テストプレイ" : "遊ぶ"}</small></button></div>
      <span class="sheen"></span></div></article>`; }).join("")}</div>`;
  return h;
}

let recFilter = "all", recMode = "pvp";
function viewRecords(){
  const gms = recFilter === "all" ? GAMES : GAMES.filter(x => x.id === recFilter), cpu = recMode === "cpu";
  const games = gms.flatMap(gm => finished(gm).filter(g => isCpuGame(g) === cpu).map(g => ({ gm, g }))).sort((a, b) => String(b.g.updated_at || b.g.created_at).localeCompare(String(a.g.updated_at || a.g.created_at)));
  const stat = {};
  games.forEach(({ gm, g }) => { const w = gm.winners(g); (g.players || []).filter(p => !isCpu(p)).forEach(p => { const s = stat[p] || (stat[p] = { p, n: 0, w: 0 }); s.n++; if (w.includes(p)) s.w++; }); });
  const rows = Object.values(stat).filter(s => player(s.p)).sort((a, b) => b.w - a.w || (b.w / b.n) - (a.w / a.n) || b.n - a.n);
  const humans = new Set(games.flatMap(x => (x.g.players || []).filter(p => !isCpu(p))));
  let h = `<div class="shelf-hd"><span class="big">RECORDS</span><h2>戦績</h2><p>${cpu ? "1人でCPUと戦った対戦の記録（対人戦の戦績とは別に集計）" : "人どうしで遊んだ対戦の記録（CPUとだけ戦った対戦は「CPU戦」に別集計）"}</p></div>`;
  h += `<div class="recmode"><button data-rm="pvp" aria-pressed="${!cpu}">対人戦</button><button data-rm="cpu" aria-pressed="${cpu}">CPU戦</button></div>`;
  h += `<div class="filt">${[["all", "すべて"], ...GAMES.map(x => [x.id, x.name])].map(([k, l]) => `<button data-rf="${k}" aria-pressed="${recFilter === k}">${esc(l)}</button>`).join("")}</div>`;
  h += `<div class="stat3"><div><small>対戦数</small><b>${games.length}</b></div><div><small>遊んだ人</small><b>${humans.size}</b></div><div><small>対戦中</small><b>${gms.reduce((a, gm) => a + gm.live().filter(g => isCpuGame(g) === cpu).length, 0)}</b></div></div>`;
  if (!games.length) return h + `<div class="emptyshelf"><b>まだ記録がありません</b>対戦が終わると、ここに勝敗が残ります。</div>`;
  h += `<div class="sec">${cpu ? "CPU戦の勝利数" : "勝利数ランキング"}</div><div class="lb">${rows.map((s, i) => `<div class="lbr ${i === 0 ? "top" : ""}" style="--pc:${pcolor(s.p)};--w:${Math.round(s.w / s.n * 100)}"><span class="r">${i + 1}</span><span class="n"><span class="dot" style="background:${pcolor(s.p)};color:${pcolor(s.p)}"></span><span>${esc(pname(s.p))}</span></span><span class="v"><b>${s.w}</b>勝 / ${s.n}戦・${Math.round(s.w / s.n * 100)}%</span></div>`).join("")}</div>`;
  h += `<div class="sec">最近の対戦</div>${games.slice(0, 30).map(({ gm, g }) => { const w = gm.winners(g), d = new Date(g.updated_at || g.created_at);
    return `<div class="hist">${gm.icon()}<div><b>${gm.name}</b><small>${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}・${(g.players || []).map(p => esc(pname(p))).join("・")}</small></div>${w.length ? `<span class="wn" style="--pc:${pcolor(w[0])}">👑 ${w.map(p => esc(pname(p))).join("・")}</span>` : `<span class="wn draw">引き分け</span>`}</div>`; }).join("")}`;
  return h;
}

function render(){
  const v = $("#view");
  const mp = player(me);
  $("#meBtn").innerHTML = mp ? `<span class="dot" style="background:${mp.color};color:${mp.color}"></span><span>${esc(mp.name)}</span>` : `<span class="dot" style="background:#555"></span><span>自分を選ぶ</span>`;
  const tabs = ["done", "rec"], ti = Math.max(0, tabs.indexOf(tab));
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  $("#tabs .ind").style.transform = `translateX(${ti * 100}%)`;
  if (!sb){ v.innerHTML = viewSetup(); bindSetup(); return; }
  if (!loaded){ v.innerHTML = `<div class="loading"><i></i>LOADING</div>`; return; }
  // タブのバッジ：自分の番のゲーム数
  const S = stages();
  ["done"].forEach(st => { const n = GAMES.filter(gm => S[gm.id] === st).reduce((a, gm) => a + gm.live().filter(g => gm.myTurn(g)).length, 0); const b = $(`#tabs [data-tab="${st}"] .bd`); b.hidden = !n; b.textContent = n; });
  if (!db.players.length){ v.innerHTML = `<div class="hero"><h2>ようこそ WARDENS OF RELIC へ</h2><p>まずは遊ぶメンバーを登録しましょう。</p><button class="cta" data-act="players">START<small>プレイヤーを登録する</small></button></div>`; bind(v); return; }
  v.innerHTML = tab === "rec" ? viewRecords() : viewShelf(tab);
  bind(v);
  setTimeout(cpuKick, 0);
  turnBuzz();
}
function needMe(){ if (player(me)) return true; toast("先に「自分」を選んでください"); openMe(); return false; }
function bind(v){
  v.querySelectorAll("[data-start]").forEach(b => b.onclick = () => { if (needMe()) gameById(b.dataset.start).start(); });
  v.querySelectorAll("[data-gopen]").forEach(b => b.onclick = () => { const gm = gameById(b.dataset.gopen), g = gm.list().find(x => x.id === b.dataset.gid); if (g) gm.open(g); });
  v.querySelectorAll("[data-rf]").forEach(b => b.onclick = () => { recFilter = b.dataset.rf; render(); });
  v.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { recMode = b.dataset.rm; render(); });
  v.querySelectorAll('[data-act="players"]').forEach(b => b.onclick = openPlayers);
}
function bindSetup(){
  const go = $("#suGo"); if (!go) return;
  $("#suUrl").value = lsGet("gl:sbUrl") || ""; $("#suKey").value = lsGet("gl:sbKey") || "";
  go.onclick = () => {
    const u = $("#suUrl").value.trim(), k = $("#suKey").value.trim();
    if (!/^https:\/\/.+/.test(u) || !k){ toast("URLとキーを入れてください"); return; }
    lsSet("gl:sbUrl", u); lsSet("gl:sbKey", k); location.reload();
  };
}

/* ---------- 自分を選ぶ ---------- */
function openMe(){
  if (!sb) return;
  if (!db.players.length){ openPlayers(); return; }
  let sel = me;
  const s = openSheet("この端末の自分", `<p class="note">この端末を使う人を選んでください。対戦にはこの名前で参加します。</p>
    <div class="chips" id="meChips">${db.players.map(p => `<button type="button" class="pc" style="--pc:${p.color}" data-p="${p.id}" aria-pressed="${p.id === me}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join("")}</div>
    <div class="btns"><button class="btn ghost" id="meEdit">メンバーを編集</button><button class="btn" id="meOk">決定</button></div>`);
  s.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { sel = b.dataset.p; s.querySelectorAll("[data-p]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
  $("#meEdit").onclick = openPlayers;
  $("#meOk").onclick = () => { if (!sel || !player(sel)){ toast("選んでください"); return; } me = sel; lsSet("gl:me", me); closeSheet(); render(); toast(`${pname(me)}として遊びます`); };
}

/* ---------- プレイヤーの登録 ---------- */
function openPlayers(){
  const s = openSheet("プレイヤー", `<p class="note">遊ぶメンバーを登録します。全員の端末で共通です。</p>
    <div>${db.players.map(p => `<div class="plist"><span class="dot" style="background:${p.color}"></span><b>${esc(p.name)}</b><button class="mini" data-ped="${p.id}">編集</button></div>`).join("") || `<p class="note">まだ誰もいません</p>`}</div>
    <div class="btns"><button class="btn" id="pAdd">＋ 追加する</button></div>`);
  s.querySelectorAll("[data-ped]").forEach(b => b.onclick = () => openPlayerEdit(player(b.dataset.ped)));
  $("#pAdd").onclick = () => openPlayerEdit(null);
}
function openPlayerEdit(p){
  const used = db.players.filter(x => !p || x.id !== p.id).map(x => x.color);
  let color = p ? p.color : (COLORS.find(c => !used.includes(c)) || COLORS[0]);
  const s = openSheet(p ? "プレイヤーを編集" : "プレイヤーを追加", `
    <label class="f"><span>名前（ニックネーム）</span><input id="pnIn" maxlength="12" value="${p ? esc(p.name) : ""}" placeholder="例：ごめ" autocomplete="off"></label>
    <div class="f"><span>色</span><div class="colors">${COLORS.map(c => `<button type="button" data-c="${c}" style="background:${c}" aria-pressed="${c === color}" aria-label="${c}"></button>`).join("")}</div></div>
    <div class="btns">${p ? `<button class="btn danger" id="pDel">削除</button>` : `<button class="btn ghost" id="pBack">戻る</button>`}<button class="btn" id="pSave">保存</button></div>`);
  s.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { color = b.dataset.c; s.querySelectorAll("[data-c]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
  const back = $("#pBack"); if (back) back.onclick = openPlayers;
  $("#pSave").onclick = async () => {
    const name = $("#pnIn").value.trim(); if (!name){ toast("名前を入れてください"); return; }
    const ok = p ? await q(sb.from("players").update({ name, color }).eq("id", p.id), "保存") : await q(sb.from("players").insert({ name, color, sort: db.players.length }).select(), "追加");
    if (!ok) return;
    await loadTable("players");
    if (!p && !player(me) && Array.isArray(ok) && ok[0]){ me = ok[0].id; lsSet("gl:me", me); toast(`${name}として遊びます`); }
    render(); openPlayers();
  };
  const del = $("#pDel");
  if (del) del.onclick = async () => {
    if (!confirm(`${p.name}を削除しますか？\n過去の対戦の記録では名前が「（不明）」になります。`)) return;
    if (!(await q(sb.from("players").delete().eq("id", p.id), "削除"))) return;
    if (me === p.id){ me = ""; lsSet("gl:me", null); }
    await loadTable("players"); render(); openPlayers();
  };
}

/* ---------- 設定 ---------- */
function openSettings(){
  if (!sb){ toast("先にSupabaseにつないでください"); return; }
  const s = openSheet("設定", `<div class="menu">
    <button data-m="me">この端末の自分<span>${esc(player(me) ? pname(me) : "未選択")}</span></button>
    <button data-m="players">プレイヤーの登録<span>${db.players.length}人</span></button>
    <button data-m="share">アプリのリンクを共有<span></span></button>
    <button data-m="reload">最新の状態に更新<span></span></button>
    ${CFG_URL ? "" : `<button data-m="conn">接続先（Supabase）を変える<span>この端末のみ</span></button>`}
  </div><p class="verline">WARDENS OF RELIC ${APP_VER}</p>`);
  s.querySelector('[data-m="me"]').onclick = openMe;
  s.querySelector('[data-m="players"]').onclick = openPlayers;
  s.querySelector('[data-m="share"]').onclick = shareLink;
  s.querySelector('[data-m="reload"]').onclick = async () => { closeSheet(); await loadAll(); render(); toast("最新にしました"); };
  const cn = s.querySelector('[data-m="conn"]');
  if (cn) cn.onclick = () => { if (!confirm("この端末の接続先を消して、入力画面に戻りますか？")) return; lsSet("gl:sbUrl", null); lsSet("gl:sbKey", null); location.reload(); };
}
function openStages(){
  const S = stages();
  const s = openSheet("ゲームの置き場所", `<p class="note">完成したら「完成品」へ、調整中は「開発中」へ。全員の端末で共通です。</p>
    ${GAMES.map(gm => `<div class="stagerow">${gm.icon()}<b>${gm.name}</b><div class="seg" data-g="${gm.id}"><button data-st="done" aria-pressed="${S[gm.id] === "done"}">完成品</button><button data-st="dev" aria-pressed="${S[gm.id] === "dev"}">開発中</button></div></div>`).join("")}
    <div class="btns"><button class="btn ghost" id="stBack">戻る</button><button class="btn" id="stSave">保存</button></div>`);
  const nx = { ...S };
  s.querySelectorAll(".seg").forEach(sg => sg.querySelectorAll("button").forEach(b => b.onclick = () => { nx[sg.dataset.g] = b.dataset.st; sg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }));
  $("#stBack").onclick = openSettings;
  $("#stSave").onclick = async () => { if (!(await putSetting("stages", nx))) return; await loadTable("app_settings"); closeSheet(); render(); toast("置き場所を保存しました"); };
}
async function shareLink(){
  const url = location.origin + location.pathname;
  try {
    if (navigator.share){ await navigator.share({ url }); return; }
    await navigator.clipboard.writeText(url); toast("リンクをコピーしました");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    try { await navigator.clipboard.writeText(url); toast("リンクをコピーしました"); } catch (_) { prompt("このリンクを共有してください", url); }
  }
}

/* ---------- 起動 ---------- */
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; lsSet("gl:tab", tab); render(); window.scrollTo(0, 0); });
$("#gearBtn").onclick = openSettings;
$("#meBtn").onclick = () => sb ? openMe() : toast("先にSupabaseにつないでください");
document.addEventListener("visibilitychange", async () => {
  if (document.hidden || !sb) return;
  try { await loadAll(); if (!inGame()) render(); drawHx(); drawSz(); drawLm(); drawWd(); } catch (e) { console.error(e); }
});
(async () => {
  render();
  if (!sb) return;
  try { await loadAll(); }
  catch (e) { $("#view").innerHTML = `<div class="hero"><h2>データを読み込めませんでした</h2><p>${esc(e.message || e)}<br>Supabaseで schema.sql を実行したか確認してください。</p><button class="cta" onclick="location.reload()">RETRY<small>もう一度読み込む</small></button></div>`; return; }
  render(); subscribe();
  if (db.players.length && !player(me)) openMe();
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
